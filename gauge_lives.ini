[Gauge]
; Raise the Team Gauge ("lives") to this value at battle start (vanilla is 4).
; Values: 1-99. Negative incoming values (the -1 "gauge off" sentinel used by
; survive-type waves) and gauge decrements are never modified.
Lives=6

; Master switch. 0 = leave the game completely vanilla. F8 toggles at runtime.
Enabled=1

; Which battle modes get the modified gauge. Comma-separated, case-insensitive:
;   All            - every mode
;   Test, Demo, Story, Free, PvP, PvESolo, PvETag, Replay, VisualLobby, Arcade,
;   AgingOnline    - individual modes
; Unlisted modes play completely vanilla (no max rewrite, no current rewrite).
; The mode is detected from the battle phase object's vtable, which is exact.
Modes=Free,PvP
